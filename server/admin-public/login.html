<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin login | Life180 Labs</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body class="adm-auth-page">
  <main class="adm-auth">
    <div class="adm-auth__card">
      <h1>Life180 Labs</h1>
      <p class="adm-auth__sub">Our Work admin panel</p>

      <form id="loginForm" novalidate>
        <label>Username
          <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p id="loginError" class="adm-form-error" hidden></p>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>
    </div>
  </main>

  <script src="assets/admin.js"></script>
  <script>Admin.initLoginForm();</script>
</body>
</html>
